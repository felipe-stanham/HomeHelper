name: Deploy to PRD

# Every prd host deploys from the same `main` push, so the instances cannot
# drift to different versions. Adding a prd host = add its runner label to the
# matrix below (and bootstrap the host per docs/local/deployment.md).

on:
  push:
    branches: [main]
  # Escape hatch: re-deploy the current `main` to a host that was offline (or
  # failed) during a push, without needing an empty commit.
  workflow_dispatch:
    inputs:
      host:
        description: Which prd host(s) to deploy
        type: choice
        default: both
        options:
          - both
          - homeserver
          - hetzner-latarnia-1

jobs:
  deploy:
    name: Deploy to ${{ matrix.host }} (prd)
    # `inputs.host` is empty on push events, so both hosts are selected unless a
    # workflow_dispatch explicitly narrows it.
    runs-on: [self-hosted, "${{ matrix.host }}"]
    environment: production
    strategy:
      # A host failing must not cancel a deploy already in flight on the other:
      # a half-applied host is worse than a failed one, and a partial deploy has
      # to stay visible as a red run rather than a cancelled one.
      fail-fast: false
      matrix:
        host: ${{ fromJSON(inputs.host != '' && inputs.host != 'both' && format('["{0}"]', inputs.host) || '["homeserver","hetzner-latarnia-1"]') }}

    steps:
      - name: Capture pre-deploy state
        run: |
          PORT=$(python3 -c "import json; print(json.load(open('/opt/latarnia/prd/config/config.json'))['system']['main_port'])")
          echo "PORT=$PORT" >> $GITHUB_ENV
          PRE_HEALTH=$(curl -sf --max-time 5 http://localhost:$PORT/health | python3 -c "import sys,json; print(json.load(sys.stdin)['health'])" 2>/dev/null || echo "unavailable")
          PRE_COUNT=$(curl -sf --max-time 5 http://localhost:$PORT/api/apps | python3 -c "import sys,json; print(json.load(sys.stdin)['total_count'])" 2>/dev/null || echo "-1")
          echo "PRE_HEALTH=$PRE_HEALTH" >> $GITHUB_ENV
          echo "PRE_COUNT=$PRE_COUNT" >> $GITHUB_ENV
          echo "Pre-deploy on ${{ matrix.host }}: health=$PRE_HEALTH, apps=$PRE_COUNT"

      - name: Backup deploy folder
        run: |
          BACKUP_DIR="/opt/latarnia/backups/prd"
          mkdir -p "$BACKUP_DIR"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          rsync -a --exclude='.git' /opt/latarnia/prd/ "$BACKUP_DIR/$TIMESTAMP/"
          ls -1t "$BACKUP_DIR" | tail -n +6 | xargs -I {} rm -rf "$BACKUP_DIR/{}"

      - name: Pull latest code
        run: |
          cd /opt/latarnia/prd
          git fetch
          git reset --hard origin/main

      - name: Restart PRD service
        run: sudo systemctl restart latarnia-prd.service

      - name: Verify post-deploy health
        run: |
          echo "Pre-deploy state: health=$PRE_HEALTH, apps=$PRE_COUNT"
          for i in $(seq 1 12); do
            POST_HEALTH=$(curl -sf --max-time 5 http://localhost:$PORT/health | python3 -c "import sys,json; print(json.load(sys.stdin)['health'])" 2>/dev/null || echo "")
            POST_COUNT=$(curl -sf --max-time 5 http://localhost:$PORT/api/apps | python3 -c "import sys,json; print(json.load(sys.stdin)['total_count'])" 2>/dev/null || echo "")
            if [ -n "$POST_HEALTH" ] && [ -n "$POST_COUNT" ]; then
              break
            fi
            echo "Waiting for service... ($i/12)"
            sleep 5
          done
          echo "Post-deploy: health=$POST_HEALTH, apps=$POST_COUNT"
          if [ -z "$POST_HEALTH" ]; then
            echo "ERROR: Service did not respond after 60s"
            exit 1
          fi
          if [ "$POST_HEALTH" = "error" ]; then
            echo "ERROR: Platform health is 'error' after deploy"
            exit 1
          fi
          if [ "$PRE_COUNT" != "-1" ] && [ "$POST_COUNT" -lt "$PRE_COUNT" ]; then
            echo "ERROR: App count dropped from $PRE_COUNT to $POST_COUNT"
            exit 1
          fi
          echo "Deploy verified: health=$POST_HEALTH, apps=$POST_COUNT"

      - name: Report deployed commit
        # always(): a failed health gate still leaves the host on the new commit
        # (the reset already ran), which is precisely when parity must be visible.
        if: always()
        run: |
          cd /opt/latarnia/prd
          echo "${{ matrix.host }} is now on $(git rev-parse HEAD)"
          echo "### ${{ matrix.host }}: \`$(git rev-parse --short HEAD)\`" >> $GITHUB_STEP_SUMMARY
